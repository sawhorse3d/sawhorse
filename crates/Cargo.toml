# Sawhorse geometry workspace. Pure Rust, no UI, no IO, no network (ADR-0001).
# Every member must build for wasm32-unknown-unknown:
#   cargo check --workspace --target wasm32-unknown-unknown
# Never commit a target-dir here; CARGO_TARGET_DIR comes from scripts/env.sh.
[workspace]
resolver = "3"
members = ["kernel", "tessellate", "inference", "export", "import", "shz", "wasm-api"]
# cargo-fuzz harness: needs nightly + libFuzzer, so it is its own workspace.
exclude = ["kernel/fuzz"]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Sawhorse contributors"]
repository = "https://github.com/sawhorse3d/sawhorse"
publish = false

[workspace.dependencies]
sawhorse-kernel = { path = "kernel" }
sawhorse-tessellate = { path = "tessellate" }
sawhorse-inference = { path = "inference" }
sawhorse-export = { path = "export" }
sawhorse-import = { path = "import" }
sawhorse-shz = { path = "shz" }

# Math: f64 everywhere inside the kernel.
glam = { version = "0.34", default-features = false, features = ["std", "f64"] }
# Generational ids for vertices / half-edges / edges / loops / faces / objects.
slotmap = "1.1"
# Shewchuk adaptive predicates.
robust = "1.2"
# Triangulation with holes (georust/earcut; NOT earcutr).
earcut = "0.4.11"
# 2D polygon booleans (coplanar merge, imprint tests).
i_overlay = "9.0"
# 3D booleans. Pure-Rust port of Manifold, Apache-2.0. Pinned EXACTLY (ADR-0001).
manifold-rust = { version = "=0.16.0", default-features = false }
# 2D polyline offsets (Offset tool; ADR-0001). MIT OR Apache-2.0, pure Rust.
cavalier_contours = { version = "0.9", default-features = false }
# 3MF: our writer is hand-made (crates/export/src/three_mf.rs); threemf reads it back in
# tests and reads 3MF imports.
threemf = "0.8"
# Zip containers (3MF, .shz). Already in the tree through threemf; same features.
zip = { version = "8", default-features = false, features = ["deflate"] }
# PNG texture images (lane 10); already in the tree through zip.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
crc32fast = "1.5"
# XML for SVG import. Already in the tree through threemf.
quick-xml = "0.39"
serde = { version = "1", features = ["derive"] }
# Exact f64 parsing: .shz snapshots and op logs must read back bit for bit.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

# Test infrastructure.
proptest = "1.12"
arbitrary = { version = "1.5", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Kernel tests run in debug (validator after every mutation) but with optimised deps
# so proptest and the sequence fuzzer get through enough cases.
[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1

# cavalier_contours checks its own slicing with debug assertions that fire on exactly
# degenerate input (an offset passing exactly through a vertex, lane-4 fuzzer find).
# Release builds, including the browser kernel, run it without them; tests run it the same
# way. The kernel validates every result it draws, so a bad slice is a typed refusal.
[profile.dev.package.cavalier_contours]
debug-assertions = false
