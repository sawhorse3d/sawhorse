[package]
name = "sawhorse-kernel"
description = "Sawhorse geometry kernel: half-edge B-rep with hole loops, sketches, push/pull, transactional ops."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["manifold"]
# 3D booleans through manifold-rust behind our BooleanEngine trait.
manifold = ["dep:manifold-rust"]
# Derive `arbitrary::Arbitrary` for op sequences (cargo-fuzz harness in fuzz/).
arbitrary = ["dep:arbitrary"]

[dependencies]
sawhorse-tessellate.workspace = true
glam.workspace = true
slotmap.workspace = true
robust.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
manifold-rust = { workspace = true, optional = true }
arbitrary = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
