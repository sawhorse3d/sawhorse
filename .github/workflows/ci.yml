name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Never forward to WSL on runners (scripts/cargo.sh, scripts/build-wasm.mjs).
  SAWHORSE_NO_WSL: "1"

jobs:
  rust:
    name: Rust (fmt, clippy, test, wasm32 check)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: "test (debug build: validator runs after every mutation)"
        run: cargo test --workspace
      # Fixed seed: main stays deterministic (a red run is a real regression, reproducible
      # with the same two variables). Random seeds run nightly (nightly-fuzz.yml).
      - name: sequence fuzzer, longer run (fixed seed)
        env:
          FUZZ_CASES: "10000"
          FUZZ_SEED: "20261011"
        run: cargo test -p sawhorse-kernel --test sequences -- --ignored long_fuzz
      - name: "day-1 spike: every crate builds for wasm32"
        run: cargo check --workspace --target wasm32-unknown-unknown
      - name: upload pending fuzzer repro
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: fuzz-repro
          path: crates/kernel/tests/repro/pending/*.json
          if-no-files-found: ignore

  web:
    name: Web (wasm-pack, build, vitest, golden, boolean diff, corpus, e2e)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - name: install wasm-pack
        run: npm install -g wasm-pack@0.15.0
      - run: npm ci
      - name: Tauri stays on 2.x
        run: npm run check:tauri
      - name: wasm-pack build
        run: npm run wasm
      - name: WASM kernel matches native golden hashes
        run: npm run golden:wasm
      - name: Boolean differential (kernel vs npm manifold-3d vs hand-computed)
        run: npm run boolean:diff
      - name: build (tsc + vite)
        run: npm run build
      - name: vitest
        run: npx vitest run
      - name: generate the .skp corpus (203 files, byte for byte against tests/corpus/manifest.json)
        run: npm run corpus:skp
      - name: install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # One Playwright run covers every spec, the 203-file corpus import and its golden
      # images included (REQUIRE_CORPUS makes a missing corpus a failure, not a skip).
      - name: e2e (all specs, corpus included)
        env:
          REQUIRE_KERNEL: "1"
          REQUIRE_CORPUS: "1"
        run: npx playwright test
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: corpus-renders
          path: test-results/corpus/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  tauri-check:
    name: Tauri shell compiles (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: webview deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: placeholder frontendDist (generate_context! needs the folder)
        run: mkdir -p dist && echo '<!doctype html><title>Sawhorse</title>' > dist/index.html
      - name: fmt (shell + device key)
        working-directory: src-tauri
        run: cargo fmt --all --check
      # clippy type-checks every target, so it is also the "shell compiles" check.
      - name: clippy (shell + device key; compiles the shell)
        working-directory: src-tauri
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: device key tests (ADR-0004; the OS keychain test is ignored on runners)
        working-directory: src-tauri
        run: cargo test --locked -p sawhorse-device-key
      - name: atomic save tests (lane 16)
        working-directory: src-tauri
        run: cargo test --locked -p sawhorse-safe-save
