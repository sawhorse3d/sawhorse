name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Never forward to WSL on runners (scripts/cargo.sh, scripts/build-wasm.mjs).
  SAWHORSE_NO_WSL: "1"

# Every job in this file has a time limit, and so do three of the web job's download
# steps, so a stalled download stops the job in minutes instead of holding the runner
# until GitHub's six-hour cancel (lane 77: a pull request's web job sat in the Playwright
# install's apt-get for six hours on 2026-11-19). Each job's limit leaves room for a first
# run after a toolchain or lockfile change, or a slow mirror on a run that still passes.
jobs:
  rust:
    name: Rust (fmt, clippy, test, wasm32 check)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: "test (debug build: validator runs after every mutation)"
        run: cargo test --workspace
      # Fixed seed: main stays deterministic (a red run is a real regression, reproducible
      # with the same two variables). Random seeds run nightly (nightly-fuzz.yml).
      - name: sequence fuzzer, longer run (fixed seed)
        env:
          FUZZ_CASES: "10000"
          FUZZ_SEED: "20261011"
        run: cargo test -p sawhorse-kernel --test sequences -- --ignored long_fuzz
      - name: "day-1 spike: every crate builds for wasm32"
        run: cargo check --workspace --target wasm32-unknown-unknown
      - name: upload pending fuzzer repro
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: fuzz-repro
          path: crates/kernel/tests/repro/pending/*.json
          if-no-files-found: ignore

  # The MCP server (crates/mcp) is started by a program that writes its own requests, on
  # someone's own disk, and its start folder is its only fence: this lints and tests it, and
  # runs the built binary once, on the two systems the Linux jobs never see.
  mcp:
    name: MCP server (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          # The Intel macOS runner, as in release.yml: this repository's arm64 macOS jobs
          # keep getting no runner (release.yml's comment on its matrix has the detail).
          - name: macOS
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: crates
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - name: "clippy (sawhorse-mcp: this system's own cfg code included)"
        run: cargo clippy -p sawhorse-mcp --all-targets -- -D warnings
      # --no-fail-fast: every test file runs even when an earlier one fails, so one
      # run shows everything this system does.
      - name: "test (sawhorse-mcp; each test prints what this system did)"
        run: cargo test -p sawhorse-mcp --no-fail-fast -- --nocapture
      - name: release build
        run: cargo build --release -p sawhorse-mcp
      - name: one real run of the binary on a fresh folder
        run: |
          set -euo pipefail
          bin=target/release/sawhorse-mcp
          dir="$(mktemp -d)"
          work="$(mktemp -d)"
          arg="$dir"
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            bin="$bin.exe"
            arg="$(cygpath -w "$dir")"
          fi
          cat > "$work/requests.jsonl" <<'EOF'
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}
          {"jsonrpc":"2.0","method":"notifications/initialized"}
          {"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"new_model","arguments":{"units":"mm"}}}
          {"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"add_board","arguments":{"name":"Shelf","thickness":19,"width":250,"length":600,"material":"Pine"}}}
          {"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"save_model","arguments":{"path":"Shelf.shz"}}}
          {"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"cut_list","arguments":{}}}
          EOF
          "$bin" "$arg" < "$work/requests.jsonl" > "$work/answers.jsonl"
          cat "$work/answers.jsonl"
          # Each answer is one line of compact JSON with its keys in alphabetical order.
          expect() {
            local n="$1" line want
            shift
            line="$(sed -n "${n}p" "$work/answers.jsonl")"
            for want in "$@"; do
              case "$line" in
                *"$want"*) ;;
                *) echo "answer $n does not hold $want"; exit 1 ;;
              esac
            done
          }
          [ "$(wc -l < "$work/answers.jsonl" | tr -d ' ')" = 5 ] || { echo "not five answers"; exit 1; }
          expect 1 '"id":1,"jsonrpc":"2.0","result"' '"protocolVersion":"2025-11-25"' '"name":"sawhorse-mcp"'
          for n in 2 3 4 5; do
            expect "$n" "\"id\":$n,\"jsonrpc\":\"2.0\",\"result\"" '"isError":false'
          done
          expect 3 '"name":"Shelf"' '"material":"Pine"'
          expect 4 '"path":"Shelf.shz"'
          expect 5 '"name":"Shelf"'
          # The saved file is in the folder, and nothing else is.
          [ -s "$dir/Shelf.shz" ] || { echo "no Shelf.shz in the folder"; exit 1; }
          [ "$(ls -A "$dir")" = "Shelf.shz" ] || { echo "the folder holds: $(ls -A "$dir")"; exit 1; }
          echo "the binary answered all five requests and saved Shelf.shz ($(wc -c < "$dir/Shelf.shz" | tr -d ' ') bytes)"
      # The binary that just answered, kept for a week from a push to main, so that someone
      # without this system's toolchain can try the server with a real client (#14). It is
      # unsigned and it is not a release. The path is from the repository's root, not from
      # `crates`: `working-directory` applies to `run` steps only.
      - uses: actions/upload-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: sawhorse-mcp-${{ matrix.name }}
          path: crates/target/release/sawhorse-mcp${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 7

  web:
    name: Web (wasm-pack, build, vitest, golden, boolean diff, corpus, e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - name: install wasm-pack
        timeout-minutes: 5
        run: npm install -g wasm-pack@0.15.0
      - run: npm ci
        timeout-minutes: 10
      - name: Tauri stays on 2.x
        run: npm run check:tauri
      - name: wasm-pack build
        run: npm run wasm
      - name: WASM kernel matches native golden hashes
        run: npm run golden:wasm
      - name: Boolean differential (kernel vs npm manifold-3d vs hand-computed)
        run: npm run boolean:diff
      - name: build (tsc + vite)
        run: npm run build
      - name: vitest
        run: npx vitest run
      - name: generate the .skp corpus (203 files, byte for byte against tests/corpus/manifest.json)
        run: npm run corpus:skp
      # Usually under a minute, but with the Ubuntu mirror slow it has passed after about 10
      # minutes here and about 11 in pages.yml, so the limit is 20, under twice the slowest.
      # No retry: a second try goes to the same mirror, and stopping apt-get partway can
      # leave its lock to fail the next try.
      - name: install Playwright Chromium
        timeout-minutes: 20
        run: npx playwright install --with-deps chromium
      # One Playwright run covers every spec, the 203-file corpus import and its golden
      # images included (REQUIRE_CORPUS makes a missing corpus a failure, not a skip).
      - name: e2e (all specs, corpus included)
        env:
          REQUIRE_KERNEL: "1"
          REQUIRE_CORPUS: "1"
        run: npx playwright test
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: corpus-renders
          path: test-results/corpus/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  tauri-check:
    name: Tauri shell compiles (Linux)
    runs-on: ubuntu-22.04
    # About a minute warm, but its apt step has passed after 37 minutes with the mirror
    # failing over, so the job, not the step, is bounded, with room beyond that.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: webview deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: placeholder frontendDist (generate_context! needs the folder)
        run: mkdir -p dist && echo '<!doctype html><title>Sawhorse</title>' > dist/index.html
      - name: fmt (shell + device key)
        working-directory: src-tauri
        run: cargo fmt --all --check
      # clippy type-checks every target, so it is also the "shell compiles" check.
      - name: clippy (shell + device key; compiles the shell)
        working-directory: src-tauri
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: device key tests (ADR-0004; the OS keychain test is ignored on runners)
        working-directory: src-tauri
        run: cargo test --locked -p sawhorse-device-key
      - name: atomic save tests (lane 16)
        working-directory: src-tauri
        run: cargo test --locked -p sawhorse-safe-save
      - name: close question tests (lane 35; the window is never held open)
        working-directory: src-tauri
        run: cargo test --locked -p sawhorse-close-guard
      - name: start-up file tests (lane 37; which argument, if any, is the file to open)
        working-directory: src-tauri
        run: cargo test --locked -p sawhorse-start-file
      - name: dialog folder tests (#71, #80; the first folder that is still there, never a part path)
        working-directory: src-tauri
        run: cargo test --locked -p sawhorse-dialog-folder
      - name: window title tests (lane 39; what the title bar shows, from the page's title)
        working-directory: src-tauri
        run: cargo test --locked -p sawhorse-window-title
      - name: logout hold tests (#73; one inhibitor while unsaved, none released that is not held)
        working-directory: src-tauri
        run: cargo test --locked -p sawhorse-logout-hold
