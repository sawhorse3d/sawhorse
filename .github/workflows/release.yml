name: Release

# Desktop installers for Windows, macOS and Linux, built by tauri-action on a v* tag into
# a draft pre-release; then SHA256SUMS.txt, the SHA-256 of every file the three builds
# uploaded, is written, checked and uploaded to the same draft (the checksums job).
# Unsigned until signing secrets exist: every signing variable is optional and only
# exported when its secret is set, so this workflow needs no secrets today.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        # An existing release tag to build for again from the dispatched ref (2026-10-20:
        # the v0.1.0-alpha.4 macOS build never got a runner on its tag's workflow file).
        # Empty: a v<run>-dev draft, as before.
        description: "Release tag to build into (empty: a v<run>-dev draft)"
        required: false
        default: ""

permissions:
  contents: write

env:
  SAWHORSE_NO_WSL: "1"

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          # macos-14 (arm64, like macos-latest), pinned 2026-10-20: for a whole afternoon
          # macos-latest, macos-15 and macos-26 handed out no runner ("not acquired by
          # Runner of type hosted"), nine attempts, while a macos-14 job started in 5 s.
          - platform: macos-14
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates
            src-tauri
      - name: Linux webview deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - name: install wasm-pack
        run: npm install -g wasm-pack@0.15.0
      - run: npm ci
      - name: Tauri stays on 2.x
        run: npm run check:tauri
      - name: Optional signing secrets (exported only when set)
        shell: bash
        env:
          S_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          S_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          S_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          S_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          S_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          S_APPLE_ID: ${{ secrets.APPLE_ID }}
          S_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          S_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD APPLE_CERTIFICATE \
                   APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            s="S_$v"
            if [ -n "${!s}" ]; then
              delim="EOF_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
              { echo "$v<<$delim"; printf '%s\n' "${!s}"; echo "$delim"; } >> "$GITHUB_ENV"
              echo "signing: $v set"
            fi
          done
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || format('v{0}-dev', github.run_number) }}
          releaseName: "Sawhorse __VERSION__"
          releaseBody: "Pre-alpha build. Installers are unsigned until signing is set up; your OS will warn before opening them."
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

  checksums:
    name: SHA256SUMS.txt
    # Every platform's build must have uploaded its files first: a failed build skips this
    # job, and the workflow is already red.
    needs: build
    runs-on: ubuntu-24.04
    env:
      # The draft release the build job made (the same expression as its tagName).
      TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || format('v{0}-dev', github.run_number) }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: download every file of the draft release
        run: |
          mkdir -p release-files
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-files
          ls -l release-files
      - name: write and check SHA256SUMS.txt
        # Fails on a missing installer kind, a file not listed exactly once, or a sum that
        # does not check (scripts/release-checksums.sh).
        run: bash scripts/release-checksums.sh release-files
      - name: upload SHA256SUMS.txt to the draft release
        run: gh release upload "$TAG" release-files/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
      - name: check what the release now holds
        # The uploaded list must be byte-identical to the one checked above, and must name
        # every other file of the release.
        run: |
          mkdir -p check
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir check
          cmp release-files/SHA256SUMS.txt check/SHA256SUMS.txt
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -vx SHA256SUMS.txt | LC_ALL=C sort > check/assets.txt
          cut -d' ' -f3- check/SHA256SUMS.txt | LC_ALL=C sort > check/listed.txt
          diff -u check/assets.txt check/listed.txt
          echo "SHA256SUMS.txt covers $(wc -l < check/listed.txt) files of $TAG"
